          - text: "<h1>[1] 两数之和</h1> <h2>题目信息</h2> <p><a href=\"https://leetcode.cn/problems/two-sum/\">题目链接</a></p> <p>#简单 #哈希表 #数组</p> <blockquote> <p>给定一个整数数组 nums 和一个整数目标值 target，请你在该数组中找出和为目标值 target 的那两个整数，并返回它们的数组下标。</p> <p>数据范围：2 &lt;= nums.length &lt;= 10^4 要求：时间复杂度 O(n)，空间复杂度 O(n)</p> </blockquote> <h2>解题思路</h2> <h3>方法一：哈希表</h3> <ol> <li><p><strong>核心思想</strong>：遍历数组，用哈希表存储已访问元素的值和下标。</p> <ul> <li>要点1：检查 target - nums[i] 是否在表中</li> <li>要点2：若存在则返回 [map.get(target - nums[i]), i]</li> </ul> </li> <li><p><strong>步骤图解</strong>：</p>"
