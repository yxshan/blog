          - text: "</li> <li><p><strong>关键点</strong>：</p> <ul> <li>哈希表查询 O(1) 是性能关键</li> <li>一次遍历完成，避免二次循环</li> </ul> </li> <li><p><strong>边界处理</strong>：</p> <ul> <li>数组长度为2的最小情况 → 直接返回两个下标</li> <li>存在多组解时只需返回第一组</li> </ul> </li> </ol> <h2>代码实现</h2> <h3>方法一</h3> <pre><code class=\"language-c\">/** * Note: The returned array must be malloced, assume caller calls free(). */ int* twoSum(int* nums, int numsSize, int target, int* returnSize) { // 假设哈希表已实现 int* result = (int*)malloc(2 * sizeof(int)); // ... 哈希表操作 return result; } </code></pre> <p>时间复杂度：O(n) 空间复杂度：O(n)</p> <h2>易错点</h2> <table> <thead> <tr> <th>序号</th> <th>易错点</th> <th>正确做法</th> </tr> </thead> <tbody><tr> <td>1</td> <td>忘记处理返回数组内存分配</td> <td>需使用 malloc 分配，并设置 returnSize</td> </tr> <tr> <td>2</td> <td>哈希表未处理冲突</td> <td>使用链地址法或开放寻址法</td> </tr> </tbody></table> <h2>总结</h2> <ul> <li>核心思想：空间换时间，用哈希表将查找时间从 O(n) 降为 O(1)</li> <li>方法对比：暴力法 O(n^2) vs 哈希表法 O(n)</li> <li>题目独立，不跨题总结</li> </ul>"
