            - code [ref=f1e389]: "struct ListNode* reverseKGroup(struct ListNode* head, int k) { // 边界：空链表或 k≤1 直接返回 if (head == NULL || k <= 1) return head; // ★ 先检查剩余节点是否足够 k 个，不够则不反转 struct ListNode* check = head; int count = 0; while (check != NULL && count < k) { check = check->next; count++; } if (count < k) return head; // 不足 k 个，保持原样 // 三指针反转前 k 个节点（与 BM1 相同逻辑） struct ListNode* prev = NULL; struct ListNode* cur = head; for (int i = 0; i < k; i++) { struct ListNode* next = cur->next; // 暂存后继 cur->next = prev; // 反转指向 prev = cur; cur = next; } // 此时：prev=组头，cur=剩余链表首节点，head=组尾 // ★ head 变成组尾，递归连接后续结果 head->next = reverseKGroup(cur, k); return prev; // 返回组头 }"
