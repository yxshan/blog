            - code [ref=f1e232]: "/** * struct ListNode { * int val; * struct ListNode *next; * }; */ struct ListNode* reverseBetween(struct ListNode* head, int m, int n) { if (m == n || head == NULL || head->next == NULL) { return head; } struct ListNode dummy; dummy.next = head; struct ListNode* pre = &dummy; for (int i = 1; i < m; i++) { pre = pre->next; } struct ListNode* cur = pre->next; // cur 固定指向区间首节点（反转后的尾）★不动 // 循环 n-m 次，每次把 cur->next 摘下来头插到 pre 后 for (int i = m; i < n; i++) { struct ListNode* tmp = cur->next; // ★ 摘下待头插的节点 cur->next = tmp->next; // cur 跳过 tmp，连接后续 tmp->next = pre->next; // tmp 指向当前区间首节点 pre->next = tmp; // pre 指向新的区间首节点 } return dummy.next; }"
