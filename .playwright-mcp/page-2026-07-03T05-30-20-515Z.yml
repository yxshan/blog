            - code [ref=f1e99]: "/** * struct ListNode { * int val; * struct ListNode *next; * }; */ struct ListNode* ReverseList(struct ListNode* head) { // 空链表直接返回 if (head == NULL) { return NULL; } struct ListNode* pre = NULL; // 已反转部分的头节点 struct ListNode* cur = head; // 当前处理的节点 while (cur != NULL) { struct ListNode* tmp = cur->next; // ★ 先暂存后继，防止断链 cur->next = pre; // 反转指针方向 pre = cur; // pre 前移 cur = tmp; // cur 前移 } return pre; // pre 即为新链表的头（cur 此时为 NULL） }"
