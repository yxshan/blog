            - code [ref=f1e376]: "struct ListNode* reverseKGroup(struct ListNode* head, int k) { // 边界：空链表或 k≤1 无需反转 if (head == NULL || k <= 1) { return head; } // ★ 先计算链表长度，确定需要反转的组数 struct ListNode* p = head; int len = 0; while (p != NULL) { len++; p = p->next; } int groups = len / k; // ★ 整除，不足 k 个的剩余节点不动 // 虚拟头节点统一处理 struct ListNode dummy; dummy.next = head; struct ListNode* pre = &dummy; // pre 指向当前组的前驱 struct ListNode* cur = head; // cur 指向当前组首节点 // ★ 外层循环：逐组反转 for (int g = 0; g < groups; g++) { struct ListNode* groupStart = cur; // ★ 记住组首（反转后变成组尾） // 内层循环：三指针反转 k 个节点（与 BM1 相同逻辑） struct ListNode* prev = NULL; for (int i = 0; i < k; i++) { struct ListNode* next = cur->next; // 暂存后继 cur->next = prev; // 反转指向 prev = cur; cur = next; } // 此时：prev=组头，cur=下一组首节点，groupStart=组尾 // ★ 连接前后组 groupStart->next = cur; // 组尾 → 下一组首 pre->next = prev; // 前驱 → 组头 pre = groupStart; // ★ pre 移到当前组尾，为下一组做准备 } return dummy.next; }"
          - paragraph [ref=f1e377]: 时间复杂度：O(n) 空间复杂度：O(1)
          - heading "递归法" [level=3] [ref=f1e378]
