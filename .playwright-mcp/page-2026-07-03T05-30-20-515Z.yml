            - code [ref=f1e219]: "/** * struct ListNode { * int val; * struct ListNode *next; * }; */ struct ListNode* reverseBetween(struct ListNode* head, int m, int n) { if (m == n || head == NULL || head->next == NULL) { return head; } // 使用虚拟头节点处理 m=1 的情况 struct ListNode dummy; dummy.next = head; struct ListNode* prev = &dummy; // 找到 m 的前一个节点 for (int i = 1; i < m; i++) { prev = prev->next; } // ★ 三指针：start(前驱) cur(区间首) end(区间尾) struct ListNode* start = prev; // 反转区间的前一个节点（不动） struct ListNode* cur = prev->next; // 反转区间的第一个节点 struct ListNode* end = cur; // ★ 记住区间尾，反转后用于连接后续 struct ListNode* pre = NULL; // 反转从 m 到 n 的节点（与 BM1 反转链表完全相同的逻辑） int count = n - m + 1; // 区间长度 while (count > 0 && cur != NULL) { struct ListNode* next = cur->next; // 暂存后继 cur->next = pre; // 反转指向 pre = cur; cur = next; count--; } // ★ 重新连接：前驱→反转后头，反转后尾→剩余部分 start->next = pre; // 例：1 → 4（反转后头） end->next = cur; // 例：2 → 5（剩余部分） return dummy.next; }"
          - paragraph [ref=f1e220]: 时间复杂度：O(n) 空间复杂度：O(1)
          - heading "头插法（推荐）" [level=3] [ref=f1e221]
